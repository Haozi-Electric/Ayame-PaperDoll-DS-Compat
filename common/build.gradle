architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // Compile-time only. NeoForge provides these at runtime; this is the exact Mixin
    // and MixinExtras version on NeoForge's compile classpath.
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.4.1"
}

loom {
    accessWidenerPath = file("${mod_access_widener_path}")
}

// NeoForge-only fork: the common module has no playable client. Loom registers default
// client/server runs for every project; without a loader they try Fabric's KnotClient and
// fail. Remove them so the only usable client task is :neoforge:runClient.
gradle.projectsEvaluated {
    loom.runs.removeIf { it.name == 'client' || it.name == 'server' }
    ['runClient', 'runServer'].each { name ->
        tasks.findByName(name)?.with {
            enabled = false
            group = null
            description = 'Unavailable in the common module - use :neoforge:runClient'
        }
    }
}