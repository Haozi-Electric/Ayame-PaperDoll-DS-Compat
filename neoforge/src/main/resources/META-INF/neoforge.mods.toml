modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "${mod_issues_url}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage_url}"
authors = '''
LucunJi(Original author)
HappyRespawnanchor
HOZ(DS Compat fork)
Deepseek(DS Compat fork)
'''
credits = '''
Fallen_Breath
X-Green
altrisi
plusls
pertaz
'''
description = '''${mod_description}'''
logoFile = "icon.png"
logoBlur = false
[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[mods]]
modId = "ayame_ds_compat"
version = "${version}"
displayName = "Ayame PaperDoll - DS Compat"
authors = '''
HOZ
Deepseek
'''
license = "LGPL-3.0-or-later"
description = '''DragonSurvival compatibility layer for Ayame PaperDoll.'''
logoFile = "icon.png"
logoBlur = false
[[dependencies.ayame_ds_compat]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ayame_ds_compat]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ayame_ds_compat]]
modId = "dragonsurvival"
type = "required"
versionRange = "[2.0.57,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.ayame_ds_compat]]
modId = "geckolib"
type = "required"
versionRange = "[4.6,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "${mod_mixin_config}"

[[mixins]]
config = "ayame_ds_compat.mixins.json"