plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

// Local mod jars for the dev client: put the DragonSurvival and GeckoLib jars for the
// matching Minecraft version into libs/<mc_version>/. The newest DS jar is used at runtime;
// compilation stays on the oldest supported DS API so the mod keeps working across versions.
def localModsDir = rootProject.file("libs/${rootProject.minecraft_version}")
def dsRuntimeJars = fileTree(dir: localModsDir, include: ['DragonSurvival-*.jar'])
def geckolibJars = fileTree(dir: localModsDir, include: ['geckolib-*.jar'])

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    compileOnly "curse.maven:dragons-survival-420799:8010249"

    if (!dsRuntimeJars.isEmpty()) {
        runtimeOnly files(dsRuntimeJars)
    } else {
        runtimeOnly "curse.maven:dragons-survival-420799:9398330"
    }

    // DragonSurvival requires GeckoLib at runtime, and DragonEntity extends GeoEntity so the
    // compat hook also needs it at compile time.
    if (!geckolibJars.isEmpty()) {
        implementation files(geckolibJars)
    } else {
        implementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:4.8.4"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

tasks.matching { it.name == 'runClient' }.configureEach {
    description = "Runs the NeoForge client with Dragon Survival from ${localModsDir}"
}

processResources {
    // 集中管理所有需要替换的占位符
    Map<String, Object> placeholders = [
            mod_license                     : project.findProperty('mod_license'),
            mod_version                     : project.version,
            mod_id                          : project.findProperty('mod_id'),
            mod_name                        : project.findProperty('mod_name'),
            mod_homepage_url                : project.findProperty('mod_homepage_url'),
            mod_description                 : project.findProperty('mod_description'),
            mod_mixin_config                : project.findProperty('mod_mixin_config'),
            mod_issues_url                  : project.findProperty('mod_issues_url'),
            neoforge_version                : project.findProperty('neoforge_version'),
            neoforge_version_range          : project.findProperty('neoforge_version_range'),
            neoforge_minecraft_version_range: project.findProperty('neoforge_minecraft_version_range'),

            version                         : project.version
    ]

    // 注册所有占位符为输入属性
    placeholders.each { key, value ->
        inputs.property key, value
    }

    // 应用替换规则
    filesMatching('META-INF/neoforge.mods.toml') {
        expand placeholders
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
}

