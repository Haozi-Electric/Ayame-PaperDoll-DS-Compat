# Gradle Settings
# Gradle JVM arguments
org.gradle.jvmargs=-Xmx2G
# MC 26.1 / NeoForge 26.1 requires the Gradle daemon to run on Java 25.
# Set it via the IDE's Gradle JVM or the JAVA_HOME environment variable.
# Enable parallel build
org.gradle.parallel=true
# Mod Properties
# Mod license type
mod_license=LGPL-3.0-or-later
# Mod version
mod_version=4.4.3.1+26.1-dsc-1.1.0
# Mod name
mod_name=Ayame PaperDoll Dragon Survival Compat Fork
# Mod ID
mod_id=ayame_paperdoll
# Archive name for the build output
mod_archives_name=ayame-paperdoll
# Mod description
mod_description=A fork of Ayame PaperDoll with DragonSurvival compatibility.\nOriginally by LucunJi/HappyRespawnanchor. Fork by HOZ/Deepseek.
# Maven group ID
mod_maven_group=org.ayamemc.ayamepaperdoll
# Mixin configuration file
mod_mixin_config=ayame-paperdoll.mixins.json
# Mod homepage URL
mod_homepage_url=https://modrinth.com/mod/ayame-paperdoll
# Mod issue tracker URL
mod_issues_url=https://github.com/AyameMC/Ayame-PaperDoll/issues
# Platform Settings
# Mod access widener path
mod_access_widener_name=ayame-paperdoll.accesswidener
# Supported platforms
enabled_platforms=neoforge
# Minecraft Properties
# Minecraft version
minecraft_version=26.1
# Dependencies Versions
# NeoForge version
neoforge_version=26.1.0.19-beta
# NeoForge Minecraft version range
neoforge_minecraft_version_range=[26.1,26.1.2]
